[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptai"
version = "1.0.0"
description = "PTAI - Local Autonomous Trading Agent for Polymarket"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="PTAI"}]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "httpx>=0.26",
    "tenacity>=8.2",
    "rich>=13.7",
    "typer>=0.9",
    "py-clob-client>=0.22",
    "web3>=6.11",
    "eth-account>=0.10",
    "playwright>=1.40",
    "ollama>=0.1.8",
    "openai>=1.12",
    "snscrape>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "loguru>=0.7",
]

[project.scripts]
ptai = "ptai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
